<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Member Login</title>

    <style>
        body{
            background:#f4f7f6;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
            font-family:sans-serif;
        }

        .login-card{
            width:550px;
            padding:60px;
            background:white;
            border-radius:20px;
            box-shadow:0 20px 50px rgba(0,0,0,0.1);
            text-align:center;
            box-sizing:border-box;
        }

        h1{
            color:#38488f;
            margin-bottom:40px;
            font-size:36px;
        }

        .form-group{
            text-align:left;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:10px;
            font-weight:600;
        }

        input{
            width:100%;
            padding:16px;
            border:2px solid #e0e6ed;
            border-radius:12px;
            box-sizing:border-box;
        }

        input:focus{
            outline:none;
            border-color:#38488f;
        }

        .btn{
            width:100%;
            padding:18px;
            background:#38488f;
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            margin-top:20px;
        }

        .btn:hover{
            background:#2e3b75;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h1>Member Login</h1>

    <!-- KHÔNG dùng form -->
    <div id="loginForm">

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>

        <div class="form-group">
            <label>Client Port</label>
            <input type="number" id="port">
        </div>

        <button class="btn" type="button" onclick="login()">Login</button>
    </div>

    <div style="display:flex;justify-content:space-between;margin-top:25px;">
        <a href="register.html">Don't have account? Register</a>
        <a href="index.html">← Back Home</a>
    </div>
</div>

<script>
const API_BASE = localStorage.getItem("apiBaseUrl") || (window.location.protocol + "//" + window.location.hostname + ":2026");

function apiUrl(path){
    return API_BASE + path;
}

async function login(){

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const port = parseInt(document.getElementById("port").value);

    // ===== VALIDATE =====
    if(!username){
        alert("Username không được để trống");
        return;
    }

    if(!password){
        alert("Password không được để trống");
        return;
    }

    if(isNaN(port) || port <= 0 || port > 65535){
        alert("Port không hợp lệ (1-65535)");
        return;
    }

    try{
        const response = await fetch(apiUrl("/login"), {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                username,
                password,
                port
            })
        });

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        let data;
        try{
            data = await response.json();
        }catch{
            throw new Error("Invalid JSON response");
        }

        console.log("LOGIN RESPONSE:", data);

        if(data.success){
            localStorage.setItem("apiBaseUrl", API_BASE);
            localStorage.setItem("authBasic", "Basic " + btoa(username + ":" + password));
            // lưu user info
            localStorage.setItem("currentUser", JSON.stringify(data.data));

            alert("Đăng nhập thành công!");

            window.location.href = "messenger.html";
        }else{
            alert(data.message || "Sai tài khoản hoặc mật khẩu");
        }

    }catch(err){
        console.error("ERROR:", err);
        alert("Lỗi: " + err.message);
    }
}
</script>

</body>
</html>
