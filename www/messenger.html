<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Messenger - BKSYSNET</title>

<style>
body { margin: 0; font-family: sans-serif; background: #f0f2f5; display: flex; height: 100vh; }

.sidebar { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
.sidebar-header { padding: 20px; background: #38488f; color: white; display: flex; justify-content: space-between; align-items: center; }
.sidebar-header h3 { margin: 0; font-size: 18px; }

.list-section { flex: 1; overflow-y: auto; padding: 10px; }
.list-item { padding: 12px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
.list-item:hover { background: #f0f2f5; }

.peer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.peer-name { flex: 1; font-size: 14px; }
.connect-btn { border: none; border-radius: 6px; padding: 6px 10px; background: #38488f; color: white; cursor: pointer; font-size: 12px; }
.connect-btn:hover { background: #2c3970; }
.connect-btn:disabled { background: #9aa3b6; cursor: not-allowed; }
.channel-active { border-color: #38488f; background: #eef1ff; }

.section-title { font-size: 12px; color: #888; margin: 15px 0 5px 5px; text-transform: uppercase; font-weight: bold; }

.main-chat { flex: 1; display: flex; flex-direction: column; }
.chat-header { padding: 15px 25px; background: white; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
.chat-header h4 { margin: 0; font-size: 18px; }

.chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

.msg { max-width: 70%; padding: 10px 15px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
.msg.sent { align-self: flex-end; background: #38488f; color: white; }
.msg.received { align-self: flex-start; background: #e4e6eb; color: black; }

.chat-input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
input[type="text"]:focus { border-color: #38488f; }

.send-btn { background: #38488f; color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; }
.send-btn:hover { background: #2c3970; }

.btn-logout { background: none; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.btn-logout:hover { background: rgba(255,255,255,0.1); }
</style>
</head>

<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h3>BKSYSNET Chat</h3>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="list-section">
        <div class="section-title">Online Peers</div>
        <div id="peerList"></div>

        <div class="section-title" style="margin-top: 20px;">Channels (Groups)</div>
        <div id="channelList"></div>
    </div>
</div>

<div class="main-chat">
    <div class="chat-header">
        <h4 id="chatWith">Select a channel</h4>
        <span id="status" style="color: #888; font-size: 14px;">● Waiting</span>
    </div>

    <div class="chat-messages" id="chatWindow">
        </div>

    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="Type message..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>

// ================== AUTH CHECK ==================
const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
const selfPeerId = Number(currentUser && currentUser.peer ? currentUser.peer.id : 0);

let activePeerIndex = {};
let channelsCache = [];
let connectedPeerIds = new Set();
let selectedChannel = null;
let selectedTargetPeerId = null;
let chatPollingTimer = null;
let channelLatestMessageId = {};
const API_BASE = localStorage.getItem("apiBaseUrl") || (window.location.protocol + "//" + window.location.hostname + ":2026");

function apiUrl(path){
    return API_BASE + path;
}

function authHeaders(){
    const headers = { "Content-Type": "application/json" };
    const token = localStorage.getItem("authBasic");
    if(token){
        headers["Authorization"] = token;
    }
    return headers;
}

if(!currentUser){
    alert("Bạn chưa đăng nhập");
    window.location.href = "/login.html";
}

// ================== LOGOUT ==================
async function logout(){
    try{
        const response = await fetch(apiUrl("/logout"), {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ username: currentUser.username })
        });

        const data = await response.json();
        console.log("LOGOUT:", data);

        if(data.success || response.ok){
            localStorage.removeItem("currentUser");
            localStorage.removeItem("authBasic");
            window.location.href = "login.html";
        } else {
            alert(data.message || "Logout thất bại");
        }
    } catch(err) {
        console.error(err);
        alert("Lỗi logout");
    }
}

// ================== INIT RECONNECT ==================
async function reconnectActivePeers() {
    try {
        const res = await fetch(apiUrl("/peers/reconnect-active"), {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ user_id: currentUser.user_id })
        });
        const data = await res.json();
        console.log("RECONNECT P2P:", data);
    } catch (err) {
        console.error("Lỗi reconnect:", err);
    }
}

// ================== LOAD PEERS ==================
async function loadPeers(){
    try{
        const res = await fetch(apiUrl("/peers/active"), {
            method: "GET",
            headers: authHeaders(),
        });
        const data = await res.json();
        console.log("PEERS:", data);

        const list = document.getElementById("peerList");
        list.innerHTML = "";
        activePeerIndex = {};

        const peersArray = (data.data && data.data.peers) ? data.data.peers : [];

        if(peersArray.length === 0){
            list.innerHTML = "<div style='padding: 12px; font-size: 14px; color: #888;'>No online users</div>";
            return;
        }

        peersArray.forEach(peer => {
            activePeerIndex[Number(peer.id)] = peer;
            if(Number(peer.id) === selfPeerId) return;

            const row = document.createElement("div");
            row.className = "list-item peer-row";

            const name = document.createElement("div");
            name.className = "peer-name";
            name.innerText = (peer.display_name || "Unknown") + " (" + peer.ip + ")";

            const btn = document.createElement("button");
            btn.className = "connect-btn";
            const isConnected = connectedPeerIds.has(Number(peer.id));
            btn.disabled = isConnected;
            btn.innerText = isConnected ? "Connected" : "Connect";
            btn.onclick = () => connectPeer(peer);

            row.appendChild(name);
            row.appendChild(btn);
            list.appendChild(row);
        });
    } catch(err) {
        console.error("Lỗi load peers:", err);
    }
}

// ================== LOAD CHANNELS ==================
function getDirectPeerIdFromChannel(channel){
    const policy = channel && channel.access_policy ? channel.access_policy : {};
    const ids = Array.isArray(policy.peer_ids) ? policy.peer_ids.map(Number) : [];
    if(ids.length < 2) return null;
    if(!ids.includes(selfPeerId)) return null;
    const other = ids.find(id => id !== selfPeerId);
    return Number.isFinite(other) ? other : null;
}

function renderChannels(){
    const list = document.getElementById("channelList");
    list.innerHTML = "";

    if (channelsCache.length === 0) {
        list.innerHTML = "<div style='padding: 12px; font-size: 14px; color: #888;'>No groups</div>";
        return;
    }

    channelsCache.forEach(channel => {
        const div = document.createElement("div");
        div.className = "list-item" + (selectedChannel && Number(selectedChannel.id) === Number(channel.id) ? " channel-active" : "");
        div.innerText = "# " + channel.name;
        div.onclick = () => selectChannel(channel);
        list.appendChild(div);
    });
}

async function loadChannels() {
    try {
        const res = await fetch(apiUrl("/channels/list"), {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ user_id: currentUser.user_id })
        });

        const data = await res.json();
        console.log("CHANNELS:", data);

        channelsCache = (data.data && data.data.channels) ? data.data.channels : [];
        connectedPeerIds = new Set();
        channelsCache.forEach(channel => {
            const directPeerId = getDirectPeerIdFromChannel(channel);
            if(directPeerId !== null){
                connectedPeerIds.add(directPeerId);
            }
        });

        if(selectedChannel){
            const matched = channelsCache.find(c => Number(c.id) === Number(selectedChannel.id));
            selectedChannel = matched || null;
            selectedTargetPeerId = matched ? getDirectPeerIdFromChannel(matched) : null;
        }

        renderChannels();
    } catch (err) {
        console.error("Lỗi load channels:", err);
    }
}
// ================== CONNECT P2P + CREATE CHANNEL ==================

async function createDirectChannelWithPeer(peer){
    const a = selfPeerId;
    const b = Number(peer.id);
    const low = Math.min(a, b);
    const high = Math.max(a, b);
    const channelName = "dm-" + low + "-" + high;

    const createRes = await fetch(apiUrl("/channels/create"), {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
            owner_peer_id: a,
            name: channelName,
            is_private: true,
            access_policy: { mode: "direct", peer_ids: [a, b] }
        })
    });
    const createData = await createRes.json();
    if(!createData.success){
        throw new Error(createData.message || "Tạo channel thất bại");
    }

    const channel = createData.data && createData.data.channel ? createData.data.channel : null;
    if(!channel || !channel.id){
        throw new Error("Không nhận được channel_id từ server");
    }

    const joinRes = await fetch(apiUrl("/channels/join"), {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
            channel_id: channel.id,
            peer_id: b,
            role: "member"
        })
    });
    const joinData = await joinRes.json();
    if(!joinData.success){
        throw new Error(joinData.message || "Thêm peer vào channel thất bại");
    }

    return channel;
}

async function connectPeer(peer){
    const peerId = Number(peer.id);
    if(connectedPeerIds.has(peerId)) return;

    const statusSpan = document.getElementById("status");
    statusSpan.innerText = "Connecting peer...";
    statusSpan.style.color = "orange";

    try {
        const res = await fetch(apiUrl("/peers/connect"), {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
                from_peer_id: selfPeerId,
                to_peer_id: peerId
            })
        });

        const data = await res.json();
        console.log("CONNECT P2P:", data);

        if (data.success) {
            statusSpan.innerText = "Connected, creating channel...";
            statusSpan.style.color = "orange";

            const existing = channelsCache.find(c => Number(getDirectPeerIdFromChannel(c)) === peerId);
            const channel = existing || await createDirectChannelWithPeer(peer);

            connectedPeerIds.add(peerId);
            selectedChannel = channel;
            selectedTargetPeerId = peerId;

            statusSpan.innerText = "● Connected + Channel Ready (#" + channel.id + ")";
            statusSpan.style.color = "green";
            await loadChannels();
            await loadPeers();
            await selectChannel(channel);
        } else {
            statusSpan.innerText = "○ Disconnected";
            statusSpan.style.color = "red";
            alert(data.message || "Kết nối peer thất bại");
        }
    } catch (err) {
        console.error("Lỗi kết nối P2P:", err);
        statusSpan.innerText = "Error";
        statusSpan.style.color = "red";
        alert("Không thể hoàn tất luồng connect/channel: " + err.message);
    }
}

// ================== CHANNEL CHAT ==================
async function loadChannelMessages(channelId){
    const chatWindow = document.getElementById("chatWindow");

    try {
        const res = await fetch(apiUrl("/channels/messages"), {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ channel_id: Number(channelId), limit: 100 })
        });
        const data = await res.json();
        if(!data.success){
            throw new Error(data.message || "Không tải được tin nhắn channel");
        }

        const rawMessages = (data.data && Array.isArray(data.data.messages)) ? data.data.messages : [];
        const latestId = rawMessages.length > 0 ? Number(rawMessages[0].id || 0) : 0;
        const prevLatestId = Number(channelLatestMessageId[channelId] || 0);

        // Không re-render nếu không có tin mới, tránh nháy UI.
        if(prevLatestId > 0 && latestId === prevLatestId){
            return;
        }

        channelLatestMessageId[channelId] = latestId;
        chatWindow.innerHTML = "";

        const messages = rawMessages.slice().reverse();
        messages.forEach(msg => {
            const type = Number(msg.sender_peer_id) === selfPeerId ? "sent" : "received";
            addMessage(msg.body, type);
        });
    } catch (err) {
        console.error("Lỗi load channel messages:", err);
    }
}

async function selectChannel(channel){
    selectedChannel = channel;
    selectedTargetPeerId = getDirectPeerIdFromChannel(channel);

    const title = document.getElementById("chatWith");
    const statusSpan = document.getElementById("status");

    if(selectedTargetPeerId !== null){
        const peer = activePeerIndex[selectedTargetPeerId];
        title.innerText = "# " + channel.name + " - " + (peer ? (peer.display_name || "Peer " + selectedTargetPeerId) : ("Peer " + selectedTargetPeerId));
        statusSpan.innerText = "● Channel selected";
        statusSpan.style.color = "green";
    } else {
        title.innerText = "# " + channel.name;
        statusSpan.innerText = "● Channel selected (non-direct)";
        statusSpan.style.color = "#888";
    }

    renderChannels();
    await loadChannelMessages(channel.id);
}

function startChannelPolling(){
    if(chatPollingTimer){
        clearInterval(chatPollingTimer);
    }

    chatPollingTimer = setInterval(async () => {
        if(!selectedChannel || !selectedChannel.id){
            return;
        }
        await loadChannelMessages(selectedChannel.id);
    }, 2000);
}

// ================== SEND MESSAGE ==================
async function sendMessage(){
    const input = document.getElementById("messageInput");
    const message = input.value.trim();

    if(!message) return;
    if(!selectedChannel || !selectedChannel.id){
        alert("Vui lòng chọn channel để chat!");
        return;
    }

    if(selectedTargetPeerId === null){
        alert("Channel hiện tại không phải direct channel hợp lệ để gửi direct message.");
        return;
    }

    try{
        const res = await fetch(apiUrl("/messages/direct"), {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
                sender_peer_id: selfPeerId,
                target_peer_id: selectedTargetPeerId,
                channel_id: selectedChannel.id,
                body: message
            })
        });

        const data = await res.json();
        console.log("SEND:", data);

        if(data.success !== false){ 
            addMessage(message, "sent");
            input.value = "";
        } else {
            alert(data.message || "Gửi tin nhắn thất bại");
        }
    } catch(err) {
        console.error(err);
    }
}


function handleKeyPress(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
}
// ================== UI MESSAGE ==================
function addMessage(text, type){
    const chat = document.getElementById("chatWindow");

    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight; // Cuộn xuống tin nhắn mới nhất
}



// ================== INIT ==================
(async function initMessenger(){
    await reconnectActivePeers();
    await loadChannels();
    await loadPeers();
    startChannelPolling();
})();

</script>

</body>
</html>
